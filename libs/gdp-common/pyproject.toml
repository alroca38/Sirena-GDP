[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdp-common"
version = "0.1.0"
description = "Módulo común de validación, base de datos, auditoría, autenticación y esquemas para Sirena GDP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gdp_common*"]
namespaces = true

